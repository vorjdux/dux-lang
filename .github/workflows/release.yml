name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Extract version from tag (strips leading 'v')
env:
  DUX_VERSION: ${{ github.ref_name }}

jobs:
  # ─── Ubuntu 22.04 ────────────────────────────────────────────────────────────
  build-ubuntu-2204:
    name: Ubuntu 22.04 (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake flex bison g++-13 \
            llvm-18-dev clang-18 libzstd-dev dpkg-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G "TGZ;DEB"

      - name: Rename artifacts
        working-directory: build
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"   # strip leading 'v'
          for f in dux-lang-*.tar.gz; do mv "$f" "dux-${VER}-linux-x86_64.tar.gz"; done
          for f in dux-lang_*.deb;    do mv "$f" "dux-lang_${VER}_amd64.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-2204
          path: |
            build/dux-*-linux-x86_64.tar.gz
            build/dux-lang_*_amd64.deb

  # ─── Ubuntu 24.04 ────────────────────────────────────────────────────────────
  build-ubuntu-2404:
    name: Ubuntu 24.04 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake flex bison g++-13 \
            llvm-18-dev clang-18 libzstd-dev dpkg-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G "TGZ;DEB"

      - name: Rename artifacts
        working-directory: build
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          for f in dux-lang-*.tar.gz; do mv "$f" "dux-${VER}-linux-x86_64-ubuntu24.tar.gz"; done
          for f in dux-lang_*.deb;    do mv "$f" "dux-lang_${VER}_amd64_ubuntu24.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-2404
          path: |
            build/dux-*-linux-x86_64-ubuntu24.tar.gz
            build/dux-lang_*_amd64_ubuntu24.deb

  # ─── Debian Bookworm ─────────────────────────────────────────────────────────
  build-debian-bookworm:
    name: Debian Bookworm (x86_64)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            cmake flex bison g++-13 llvm-18-dev clang-18 \
            libzstd-dev dpkg-dev ca-certificates

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G "TGZ;DEB"

      - name: Rename artifacts
        working-directory: build
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          for f in dux-lang-*.tar.gz; do mv "$f" "dux-${VER}-linux-x86_64-debian.tar.gz"; done
          for f in dux-lang_*.deb;    do mv "$f" "dux-lang_${VER}_amd64_debian.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: debian-bookworm
          path: |
            build/dux-*-linux-x86_64-debian.tar.gz
            build/dux-lang_*_amd64_debian.deb

  # ─── Fedora 40 ───────────────────────────────────────────────────────────────
  build-fedora-40:
    name: Fedora 40 (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y cmake flex bison gcc-c++ \
            llvm18-devel clang18 zstd-devel rpm-build

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G "TGZ;RPM"

      - name: Rename artifacts
        working-directory: build
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          for f in dux-lang-*.tar.gz; do mv "$f" "dux-${VER}-linux-x86_64-fedora.tar.gz"; done
          for f in dux-lang-*.rpm;    do mv "$f" "dux-lang-${VER}-1.x86_64.rpm"; done

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-40
          path: |
            build/dux-*-linux-x86_64-fedora.tar.gz
            build/dux-lang-*-1.x86_64.rpm

  # ─── macOS 14 - Apple Silicon (arm64) ────────────────────────────────────────
  build-macos-arm64:
    name: macOS 14 (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake flex bison llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin"    >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin"   >> $GITHUB_PATH

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G "TGZ"

      - name: Rename artifacts
        working-directory: build
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          for f in dux-lang-*.tar.gz; do mv "$f" "dux-${VER}-macos-arm64.tar.gz"; done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/dux-*-macos-arm64.tar.gz

  # ─── macOS 13 - Intel (x86_64) ───────────────────────────────────────────────
  build-macos-x86_64:
    name: macOS 13 (x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake flex bison llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin"    >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin"   >> $GITHUB_PATH

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G "TGZ"

      - name: Rename artifacts
        working-directory: build
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          for f in dux-lang-*.tar.gz; do mv "$f" "dux-${VER}-macos-x86_64.tar.gz"; done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: build/dux-*-macos-x86_64.tar.gz

  # ─── Publish GitHub Release ──────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs:
      - build-ubuntu-2204
      - build-ubuntu-2404
      - build-debian-bookworm
      - build-fedora-40
      - build-macos-arm64
      - build-macos-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: List release assets
        run: ls -lh dist/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Dux ${{ github.ref_name }}"
          body_path: ${{ github.workspace }}/CHANGELOG.md
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
