name: Release

# Triggered by a version tag: git tag v0.1.3 && git push origin v0.1.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # required to create the release and upload assets

jobs:

  # ── Ubuntu 24.04 — generic Linux TGZ + DEB ────────────────────────────────
  build-linux:
    name: Linux x86_64 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake flex bison \
            llvm-18-dev libssl-dev libzstd-dev libreadline-dev clang-18

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        # CPack produces: dux-<ver>-linux-x86_64.tar.gz + dux-lang_<ver>_amd64.deb
        run: cmake --build build --target package

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            build/dux-*.tar.gz
            build/dux-lang_*.deb

  # ── Fedora 40 — RPM only ────────────────────────────────────────────────────
  build-fedora:
    name: Fedora 40 x86_64 (RPM)
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y cmake flex bison gcc-c++ \
            llvm-devel clang zlib-devel libzstd-devel openssl-devel \
            readline-devel rpm-build

      - name: Configure
        # -DCPACK_GENERATOR=RPM: skip the TGZ (Ubuntu already provides it)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib64/cmake/llvm \
            -DDUX_SANITIZE=OFF \
            -DCPACK_GENERATOR=RPM

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        # CPack produces: dux-lang-<ver>-1.x86_64.rpm
        run: cmake --build build --target package

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: build/dux-lang-*.rpm

  # ── macOS arm64 + x86_64 — TGZ ─────────────────────────────────────────────
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake flex bison llvm@18 readline
          brew link --overwrite llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin"    >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin"   >> $GITHUB_PATH

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose -j1

      - name: Package
        # CPack produces: dux-<ver>-macos-arm64.tar.gz (or x86_64)
        run: cmake --build build --target package

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/dux-*.tar.gz

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [build-linux, build-fedora, build-macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          ver = Path("VERSION").read_text().strip()
          text = Path("CHANGELOG.md").read_text()
          m = re.search(
              rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)',
              text, re.DOTALL
          )
          body = m.group(1).strip() if m else f"Release {ver}"
          Path("release_notes.md").write_text(body)
          print(f"Release notes ({ver}):\n{body[:300]}...")
          PYEOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="$(cat VERSION)"
          # --prerelease if tag contains a hyphen, e.g. v0.2.0-beta.1
          PRERELEASE=""
          [[ "$TAG" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" dist/* \
            --title "dux ${VER}" \
            --notes-file release_notes.md \
            $PRERELEASE
