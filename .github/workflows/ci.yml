name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            cxx: g++-13
            packages: g++-13
          - name: Clang 18
            cxx: clang++-18
            packages: clang-18

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake flex bison ${{ matrix.packages }}

      - name: Configure (Debug)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure (Release)
        run: |
          cmake -B build-rel \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build Release
        run: cmake --build build-rel -j$(nproc)

      - name: Test Release
        run: ctest --test-dir build-rel --output-on-failure
