name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            cxx: g++-13
            packages: g++-13
          - name: Clang 18
            cxx: clang++-18
            packages: clang-18

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake flex bison \
            llvm-18-dev libssl-dev libzstd-dev \
            ${{ matrix.packages }}

      - name: Configure (Debug)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure (Release)
        run: |
          cmake -B build-rel \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build Release
        run: cmake --build build-rel -j$(nproc)

      - name: Test Release
        run: ctest --test-dir build-rel --output-on-failure

  build-macos:
    name: macOS (AppleSilicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake flex bison llvm@18
          brew link --overwrite llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin"    >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin"   >> $GITHUB_PATH

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-fedora:
    name: Fedora 40
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y cmake flex bison gcc-c++ \
            llvm-devel clang zlib-devel libzstd-devel openssl-devel rpm-build

      - name: Configure (Debug)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib64/cmake/llvm

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure (Release)
        run: |
          cmake -B build-rel \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib64/cmake/llvm

      - name: Build Release
        run: cmake --build build-rel -j$(nproc)

      - name: Test Release
        run: ctest --test-dir build-rel --output-on-failure
